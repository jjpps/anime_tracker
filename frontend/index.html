<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anime tracker</title>
<style>
  :root {
    --bg: #14161a; --card: #1c1f26; --linha: #262a33;
    --texto: #e6e8ec; --fraco: #8b93a1;
    --ok: #4ade80; --alerta: #fbbf24; --erro: #f87171; --acento: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--linha);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; margin-left: 8px; }
  nav button {
    background: none; border: 0; color: var(--fraco); cursor: pointer;
    padding: 8px 14px; border-radius: 6px; font-size: 14px;
  }
  nav button.ativo { background: var(--card); color: var(--texto); }
  #resumo { margin-left: auto; color: var(--fraco); font-size: 13px; }
  main { padding: 20px 24px; max-width: 1100px; }
  #busca {
    width: 100%; max-width: 380px; padding: 8px 12px; margin-bottom: 16px;
    background: var(--card); border: 1px solid var(--linha);
    border-radius: 6px; color: var(--texto); font-size: 14px;
  }
  .item {
    background: var(--card); border: 1px solid var(--linha); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .dados { flex: 1; min-width: 260px; }
  .titulo { font-weight: 600; }
  .alvo { color: var(--fraco); font-size: 13px; margin-top: 2px; }
  .alvo a { color: var(--acento); text-decoration: none; }
  .alvo a:hover { text-decoration: underline; }
  .sem-match { color: var(--erro); }
  .chip {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--linha); color: var(--fraco); white-space: nowrap;
  }
  .chip.confirmed { color: var(--ok); border-color: var(--ok); }
  .chip.rejected { color: var(--erro); border-color: var(--erro); }
  .chip.dup { color: var(--alerta); border-color: var(--alerta); }
  .acoes { display: flex; gap: 6px; align-items: center; }
  .acoes button {
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--linha); background: #232733; color: var(--texto);
  }
  .acoes button:hover { border-color: var(--acento); }
  .acoes button:disabled { opacity: .5; cursor: default; }
  .acoes input {
    width: 92px; padding: 6px 8px; font-size: 13px;
    background: var(--bg); border: 1px solid var(--linha);
    border-radius: 6px; color: var(--texto);
  }
  .vazio, .carregando { color: var(--fraco); padding: 32px 0; }
  .aviso {
    background: #2a2416; border: 1px solid var(--alerta); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 14px;
  }
  .aviso.ok { background: #16221a; border-color: var(--ok); }
  .aviso ul { margin: 6px 0 0; padding-left: 20px; }
  .aviso pre {
    background: var(--bg); padding: 8px 10px; border-radius: 6px;
    overflow-x: auto; font-size: 12px; margin: 8px 0 6px;
  }
  #sincronizar, #casar, #mal {
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--linha); background: #232733; color: var(--texto);
  }
  #sincronizar:hover:not(:disabled), #casar:hover:not(:disabled),
  #mal:hover:not(:disabled) { border-color: var(--acento); }
  #sincronizar:disabled, #casar:disabled, #mal:disabled { opacity: .6; cursor: default; }
  #conectar {
    padding: 6px 12px; border-radius: 6px; text-decoration: none;
    font-size: 13px; border: 1px solid var(--linha); color: var(--texto);
  }
</style>
</head>
<body>
<header>
  <h1>anime tracker</h1>
  <nav>
    <button id="tab-catalog" class="ativo">Catálogo sincronizado</button>
    <button id="tab-pending">Catálogo a revisar</button>
  </nav>
  <span id="resumo"></span>
  <button id="sincronizar">Sincronizar</button>
  <button id="casar">Casar com AniList</button>
  <button id="mal">Sincronizar MyAnimeList</button>
  <a id="conectar" href="/auth/anilist">Conectar AniList</a>
</header>

<main>
  <input id="busca" placeholder="filtrar por série...">
  <div id="lista" class="carregando">carregando...</div>
</main>

<script>
const estado = { aba: "catalog", q: "", stats: null };
const $ = (id) => document.getElementById(id);

const rota = () => estado.aba === "catalog" ? "/api/catalog" : "/api/pending";

async function carregar() {
  $("lista").className = "carregando";
  $("lista").textContent = "carregando...";
  try {
    const resp = await fetch(rota() + "?q=" + encodeURIComponent(estado.q));
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    render(await resp.json());
  } catch (e) {
    $("lista").className = "vazio";
    $("lista").textContent = "falha ao carregar: " + e.message;
  }
}

function render(itens) {
  const lista = $("lista");
  lista.className = "";
  if (!itens.length) {
    lista.className = "vazio";
    lista.textContent = mensagemVazia();
    return;
  }
  lista.replaceChildren(...itens.map(criarItem));
}

// lista vazia tem três causas diferentes; dizer qual evita o usuário achar
// que terminou quando na verdade nem começou
function mensagemVazia() {
  const s = estado.stats;
  if (s && !s.series) return "nenhum dado ainda — clique em Sincronizar";
  if (s && !s.matched) {
    return s.catalogo_local
      ? "séries importadas, mas nenhuma casada ainda — clique em Sincronizar"
      : "séries importadas, mas nenhuma casada: AniList fora do ar e catálogo local ausente";
  }
  return estado.aba === "catalog"
    ? "nenhuma temporada com correspondência no AniList"
    : "nada pendente: tudo já foi revisado";
}

function criarItem(r) {
  const div = document.createElement("div");
  div.className = "item";

  const dados = document.createElement("div");
  dados.className = "dados";

  const titulo = document.createElement("div");
  titulo.className = "titulo";
  titulo.textContent = `${r.series_title} — T${r.season_number} (${r.cr_episodes} eps)`;
  dados.append(titulo);

  const alvo = document.createElement("div");
  alvo.className = "alvo";
  if (r.anilist_id) {
    alvo.append("→ ");
    const link = document.createElement("a");
    link.href = r.anilist_url || `https://anilist.co/anime/${r.anilist_id}`;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = r.anilist_title || `#${r.anilist_id}`;
    alvo.append(link, ` (${r.anilist_episodes ?? "?"} eps) · conf ${r.confidence.toFixed(2)}`);
  } else {
    alvo.className += " sem-match";
    alvo.textContent = "sem correspondência no AniList";
  }
  dados.append(alvo);
  div.append(dados);

  if (r.duplicate_of !== null && r.duplicate_of !== undefined) {
    div.append(chip("dup", `mesma obra da T${r.duplicate_of}`));
  }

  if (estado.aba === "catalog") div.append(chip(r.review_status, ROTULO[r.review_status]));

  if (r.review_status === "pending") {
    div.append(acoes(r, [["Confirmar", "confirmed"], ["Rejeitar", "rejected"]], true));
  } else {
    div.append(acoes(r, [["Reabrir", "pending"]]));
  }
  return div;
}

const ROTULO = { confirmed: "confirmado", rejected: "rejeitado", pending: "a revisar" };

function chip(classe, texto) {
  const s = document.createElement("span");
  s.className = "chip " + classe;
  s.textContent = texto;
  return s;
}

function acoes(r, botoes, comCorrecao) {
  const box = document.createElement("div");
  box.className = "acoes";

  let campo;
  if (comCorrecao) {
    campo = document.createElement("input");
    campo.placeholder = "anilist id";
    campo.title = "corrigir o id do AniList ao confirmar";
    box.append(campo);
  }

  for (const [rotulo, status] of botoes) {
    const b = document.createElement("button");
    b.textContent = rotulo;
    b.onclick = async () => {
      box.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const corpo = { status };
      // o id digitado corrige o alvo junto com a confirmação
      if (campo && campo.value.trim()) corpo.anilist_id = campo.value.trim();
      try {
        const resp = await fetch("/api/review/" + encodeURIComponent(r.season_id), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(corpo),
        });
        if (!resp.ok) throw new Error((await resp.json()).erro || "HTTP " + resp.status);
        await Promise.all([carregar(), resumo()]);
      } catch (e) {
        alert("não foi possível salvar: " + e.message);
        box.querySelectorAll("button").forEach((x) => (x.disabled = false));
      }
    };
    box.append(b);
  }
  return box;
}

let pollTarefa;
const BOTOES = {
  sync: ["sincronizar", "Sincronizar"],
  match: ["casar", "Casar com AniList"],
  mal: ["mal", "Sincronizar MyAnimeList"],
};

function travarBotoes(travado) {
  for (const [id] of Object.values(BOTOES)) $(id).disabled = travado;
}

async function iniciarTarefa(tipo, rota, corpo) {
  travarBotoes(true);
  const resp = await fetch(rota, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });

  if (resp.status === 429) {
    const { minutos_ate_liberar } = await resp.json();
    travarBotoes(false);
    // o TTL evita repetição acidental, mas o clique explícito é intenção
    if (confirm(`Sincronizado há pouco (libera em ${minutos_ate_liberar} min). Sincronizar mesmo assim?`)) {
      return iniciarTarefa(tipo, rota, { ...corpo, force: true });
    }
    return;
  }
  if (!resp.ok) {
    alert("não foi possível iniciar: " + ((await resp.json()).erro || resp.status));
    travarBotoes(false);
    return;
  }
  acompanharTarefa();
}

function acompanharTarefa() {
  clearInterval(pollTarefa);
  pollTarefa = setInterval(async () => {
    let s;
    try { s = await (await fetch("/api/task")).json(); } catch { return; }

    const [id, rotulo] = BOTOES[s.tipo] || BOTOES.sync;
    if (s.rodando) {
      const passo = s.total ? ` ${s.feito}/${s.total}` : "";
      $(id).textContent = `${s.etapa || rotulo}${passo}...`;
      return;
    }

    clearInterval(pollTarefa);
    $(id).textContent = rotulo;
    travarBotoes(false);
    if (s.erro) alert(`${s.tipo} falhou: ` + s.erro);
    else if (s.resultado) relatar(s.tipo, s.resultado, id);
    await Promise.all([carregar(), resumo()]);
  }, 1000);
}

function relatar(tipo, r, id) {
  if (tipo === "mal") return relatarMal(r, id);

  // a fonte do match aparece: casar contra outra base não pode ser silencioso
  const fonte = r.fonte_match ? ` · via ${r.fonte_match}` : " · match não rodou";
  $(id).title = tipo === "sync"
    ? `${r.episodios} episódios novos · ${r.matches} temporadas casadas${fonte}`
    : `${r.matches} temporadas casadas em ${r.alvos} séries${fonte}`;

  // sem fonte de match a fila fica vazia; avisar só no tooltip esconderia isso
  if (!r.fonte_match) return avisarSemMatch();
  if (tipo === "match" && !r.alvos) {
    if (confirm("Todas as temporadas já têm correspondência. Refazer o match de tudo?" +
                "\n(o que você já revisou é preservado)")) {
      iniciarTarefa("match", "/api/match", { todas: true });
    }
  }
}

function relatarMal(r, id) {
  $(id).title = `${r.resolvidos} ids resolvidos · ${r.checados} conferidos via ${r.fonte}`;

  const partes = [
    `<strong>MyAnimeList: ${r.resolvidos} ids resolvidos, ${r.checados} conferidos</strong>`,
    `Fonte: ${r.fonte}.`,
  ];
  if (r.sem_mapa) partes.push(`${r.sem_mapa} sem correspondência no catálogo local.`);
  if (r.divergentes?.length) {
    partes.push(`<br><strong>${r.divergentes.length} divergência(s)</strong> — o que o` +
      " MyAnimeList diz não bate com o nosso match:<ul>" +
      r.divergentes.slice(0, 10).map(d =>
        `<li>${escapar(d.serie)} T${d.temporada}: ${escapar(d.motivo)}</li>`).join("") +
      (r.divergentes.length > 10 ? `<li>... e mais ${r.divergentes.length - 10}</li>` : "") +
      "</ul>Nada foi corrigido automaticamente: revise na aba a revisar.");
  }
  if (r.erros?.length) {
    partes.push(`<br><strong>${r.erros.length} erro(s) de conexão.</strong>`);
    // o Jikan é proxy do MAL e anda falhando; a chave oficial contorna
    if (!r.oficial) {
      partes.push("O Jikan é um proxy do MyAnimeList e anda falhando em alcançá-lo." +
        " Preencha <code>MAL_CLIENT_ID</code> no <code>.env</code> para usar a API oficial" +
        " (myanimelist.net/apiconfig).");
    }
  }
  mostrarAviso(partes.join(" "), r.divergentes?.length || r.erros?.length ? "aviso" : "aviso ok");
}

function escapar(texto) {
  const d = document.createElement("div");
  d.textContent = texto ?? "";
  return d.innerHTML;
}

function mostrarAviso(html, classe = "aviso") {
  const aviso = document.createElement("div");
  aviso.className = classe;
  aviso.innerHTML = html;
  const main = document.querySelector("main");
  main.querySelector(".aviso")?.remove();
  main.prepend(aviso);
}

function avisarSemMatch() {
  mostrarAviso(
    "<strong>Séries sincronizadas, mas nenhuma foi casada com o AniList.</strong>" +
    "<br>A API do AniList está indisponível e o download do catálogo local falhou." +
    " Verifique a conexão e sincronize de novo — o arquivo é baixado sozinho na" +
    " primeira vez (62 MB).");
}

async function resumo() {
  try {
    const s = await (await fetch("/api/stats")).json();
    estado.stats = s;
    $("resumo").textContent =
      `${s.series} séries · ${s.seasons} temporadas · ${s.confirmed} confirmados · ${s.pending} a revisar`;
    const conectado = s.anilist_conectado;
    $("conectar").textContent = conectado ? "AniList conectado" : "Conectar AniList";
    $("conectar").style.color = conectado ? "var(--ok)" : "";
  } catch { /* o resumo é acessório; a lista é o que importa */ }
}

for (const aba of ["catalog", "pending"]) {
  $("tab-" + aba).onclick = () => {
    estado.aba = aba;
    $("tab-catalog").classList.toggle("ativo", aba === "catalog");
    $("tab-pending").classList.toggle("ativo", aba === "pending");
    carregar();
  };
}

let debounce;
$("busca").oninput = (e) => {
  estado.q = e.target.value;
  clearTimeout(debounce);
  debounce = setTimeout(carregar, 250);
};

$("sincronizar").onclick = () => iniciarTarefa("sync", "/api/sync", {});
$("casar").onclick = () => iniciarTarefa("match", "/api/match", {});
$("mal").onclick = () => iniciarTarefa("mal", "/api/mal", {});

resumo().then(carregar);
// se um sync já estiver rodando (outra aba, ou reload no meio), acompanha
fetch("/api/task").then(r => r.json()).then(s => {
  if (s.rodando) { travarBotoes(true); acompanharTarefa(); }
}).catch(() => {});
</script>
</body>
</html>
